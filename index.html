<style>
/* Layout: dark-first dashboard. Top greeting and stat cards, then a two-column grid (subjects and weekly chart | continue, plan, achievement), then exams and backup. Indigo to violet accent, used on progress and the primary action. */
:root{
  --bg:#f3f2fb; --glow:#e3dffb; --surface:#ffffff; --fg:#14122b; --muted:#6a6788; --line:#dedbf2;
  --p0:#6aa8ff; --p1:#7c83ff; --p2:#c79bff; --p3:#ff7fa8;
  --accent:#5b4bdb; --accent2:#8b6cf0; --accent-ink:#ffffff; --accent-soft:#ebe8fd; --track:#e6e3f7; --ok:#12805a;
  --font-b:'Plus Jakarta Sans','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
  --font-d:'Plus Jakarta Sans','Hind Siliguri','Noto Sans Bengali',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1020; --glow:#1d2150; --surface:#171a30; --fg:#eef0ff; --muted:#a9aed6; --line:#262b55;
    --accent:#7c83ff; --accent2:#a98bff; --accent-ink:#0e1020; --accent-soft:#1f2346; --track:#262b55; --ok:#3ccf91;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1020; --glow:#1d2150; --surface:#171a30; --fg:#eef0ff; --muted:#a9aed6; --line:#262b55;
  --accent:#7c83ff; --accent2:#a98bff; --accent-ink:#0e1020; --accent-soft:#1f2346; --track:#262b55; --ok:#3ccf91;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:radial-gradient(1000px 420px at 12% -8%, var(--glow), transparent 62%), var(--bg);
  background-color:var(--bg);
  color:var(--fg); font-family:var(--font-b); font-size:16px; line-height:1.6;
  padding-block:18px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
main{display:flex;flex-direction:column;gap:16px;min-width:0}
h1,h2,h3{font-family:var(--font-d);margin:0;line-height:1.3;text-wrap:balance}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 14px;font-size:.9rem;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.btn.big{flex:1;padding:12px 16px;font-size:1rem;font-weight:700}

.nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.nav a{flex:0 0 auto;display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.92rem;white-space:nowrap;font-weight:500}
.nav a small{color:var(--muted);font-size:.8rem}
.nav a.on{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:var(--accent-ink);font-weight:700}
.nav a.on small{color:inherit;opacity:.85}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;min-width:0}
.card h2{font-size:1.15rem;font-weight:700}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.sub{color:var(--muted);font-size:.92rem;margin:0}

.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dhead h1{font-size:clamp(1.7rem,5vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.dhead p{margin:4px 0 10px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.9rem;background:var(--surface);white-space:nowrap}
.nameedit{display:flex;gap:8px;flex-wrap:wrap}
.nameedit input{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;min-width:0;width:12rem}

.stats{display:grid;grid-template-columns:1.45fr repeat(4,minmax(0,1fr));gap:12px}
.stat{padding:16px;display:flex;flex-direction:column;gap:2px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:10px;flex:0 0 auto}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stat .lbl{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stat .val{font-size:clamp(1.3rem,3vw,1.7rem);font-weight:800;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .val.sm{font-size:1.05rem}
.stat .cap{color:var(--muted);font-size:.85rem}
.goalin{width:4.4rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:1px 6px;text-align:center;font-size:.85rem}
.overall{flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,var(--accent-soft),var(--surface));border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.overall .ov{min-width:0;flex:1}
.overall .ov .nm{font-weight:700;font-size:1.05rem}
.overall .ov .bar{margin-top:8px}
.ring{position:relative;width:84px;height:84px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--track);stroke-width:10}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring .txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring .txt b{font-size:.95rem;font-weight:800;font-variant-numeric:tabular-nums}

.dgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.bar{display:block;height:8px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .35s}

.prow{display:grid;grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"tile nm pc" "tile ct pc" ". bar bar";gap:0 14px;align-items:center;padding:10px 8px;border-radius:14px}
.prow:hover{background:var(--accent-soft)}
.prow .tile{grid-area:tile;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:.8rem}
.prow .nm{grid-area:nm;font-weight:700;min-width:0}
.prow .ct{grid-area:ct;color:var(--muted);font-size:.85rem}
.prow .pc{grid-area:pc;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.prow .bar{grid-area:bar;height:6px;margin-top:6px}

.cont{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(160deg,var(--accent-soft),var(--surface) 70%)}
.eyebrow{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:800}
.cont h2{font-size:1.4rem;margin:6px 0 2px;font-weight:800}
.cont .bar{margin-top:12px}
.btns{display:flex;gap:10px;margin-top:14px}
.timer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.timer small{color:var(--muted);display:block}
.timer b{font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;display:block}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}

.tl2{list-style:none;margin:0 0 10px;padding:0}
.tl2 li{display:flex;align-items:center;gap:8px;padding:5px 0}
.tl2 label{flex:1;min-width:0;display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tl2 input[type=checkbox]{width:1.15rem;height:1.15rem;margin-top:.3rem;accent-color:var(--accent);flex:0 0 auto}
.tl2 input:checked + span{color:var(--muted);text-decoration:line-through}
.tag{font-size:.7rem;font-weight:700;color:#b45309;background:color-mix(in srgb,#f59e0b 20%,transparent);border-radius:6px;padding:0 6px;margin-left:6px}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.ach{display:flex;gap:14px;align-items:center;background:linear-gradient(160deg,color-mix(in srgb,var(--ok) 16%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
.ach .ico{width:52px;height:52px;margin:0;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.ach .ico svg{width:26px;height:26px}
.ach h2{font-size:1.2rem;font-weight:800}

.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:130px;margin-top:6px}
.wk .c{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
.wk .c i{display:block;width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--accent2),var(--accent));min-height:4px}
.wk .c span{font-size:.72rem;color:var(--muted)}

.x{border:0;background:none;color:var(--muted);font-size:1.2rem;line-height:1;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--fg);background:var(--track)}
.addrow{display:flex;gap:8px;margin:6px 0 10px}
.addrow input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 12px}
.exadd{flex-wrap:wrap;margin-top:14px}
.exadd input[type=text]{flex:1 1 12rem}
.exadd input[type=date]{flex:0 0 auto}

.erow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(5.5rem,auto);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.erow:first-of-type{border-top:0}
.erow input[type=date]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 8px;min-width:0}
.erow .lf{text-align:right;font-weight:700;color:var(--accent);font-size:.92rem}
.erow .lb{min-width:0}

.bk textarea{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;resize:vertical}
.bk .acts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.bk summary{cursor:pointer;font-weight:700}
.msg{font-size:.9rem;color:var(--ok)}
.nl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}

.narrow{max-width:860px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.subhead{display:flex;flex-direction:column;gap:10px}
.subhead .line{display:flex;align-items:center;gap:12px}
.subhead .line .bar{flex:1}
.subhead .line b{font-variant-numeric:tabular-nums;min-width:3rem;text-align:right}
.tabs{display:flex;gap:8px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 14px;font-weight:600}
.tabs button.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent}
.tabs button span{margin-left:6px;opacity:.85;font-size:.85rem}
.rows{display:flex;flex-direction:column;gap:10px}
.ch{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ch[open]{border-color:var(--accent)}
.ch summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 14px}
.ch summary::-webkit-details-marker{display:none}
.ch .no{width:2rem;height:2rem;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem}
.ch .nm{font-weight:600;min-width:0}
.ch .meta{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ch .meta b{color:var(--fg);min-width:2.6rem;text-align:right}
.ch summary .bar{grid-column:2 / 4;height:6px}
.ch .body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.tl{list-style:none;margin:8px 0;padding:0}
.tl li{display:flex;align-items:center;gap:6px}
.tl label{flex:1;display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer;min-width:0}
.tl input[type=checkbox]{width:1.2rem;height:1.2rem;margin-top:.28rem;accent-color:var(--accent);flex:0 0 auto}
.tl label span{min-width:0}
.tl input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.bulk{display:flex;gap:8px;margin-bottom:12px}
.ch textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;resize:vertical;line-height:1.6}

@media (max-width:1000px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats .overall{grid-column:1 / -1}
}
@media (max-width:860px){
  .dgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .erow{grid-template-columns:minmax(0,1fr) auto}
  .erow .lf{grid-column:1 / 3;text-align:left}
  .stat{padding:14px}
}

.cm-head h1{font-size:1.6rem;margin-bottom:4px}
.cm-auth{display:flex;flex-direction:column;gap:8px;max-width:460px}
.cm-l{font-size:.85rem;color:var(--muted);margin-top:6px;display:block}
.cm-in{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.cm-row{display:flex;gap:8px}
.cm-row .cm-in{flex:1}
.cm-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:14px}
.cm-me{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cm-groups{display:flex;flex-wrap:wrap;gap:8px}
.cm-g,.cm-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px}
.cm-g.on,.cm-tabs button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.cm-tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.rm-u{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.rm-u:first-child{border-top:0}
.rm-u .cm-av{flex:none}.rm-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.rm-m b{font-weight:600}.rm-m small{color:var(--muted)}
.rm-t{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}.rm-off{opacity:.62}
.rm-live{width:8px;height:8px;border-radius:50%;background:#3fae7a;display:inline-block;margin-right:6px;animation:rmp 1.6s infinite}
@keyframes rmp{50%{opacity:.35}}
.rm-h{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin:0 0 6px}.rm-h b{color:#3fae7a}
@media (prefers-reduced-motion:reduce){.rm-live{animation:none}}
.cm-gh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.cm-code{letter-spacing:.12em;font-family:ui-monospace,Menlo,Consolas,monospace;margin-right:8px}
.cm-note{margin:6px 0;font-size:.92rem}
.cm-note.err{color:#e5484d}
.cm-note.ok{color:var(--ok)}
.cm-board{display:flex;flex-direction:column;gap:8px}
.cm-r{display:grid;grid-template-columns:1.6rem 2.2rem minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px}
.cm-r.me{border-color:var(--accent);background:var(--accent-soft)}
.cm-rk{font-weight:700;color:var(--muted);text-align:center}
.cm-av{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700}
.cm-r.me .cm-av{background:var(--surface)}
.cm-mid{display:flex;flex-direction:column;gap:4px;min-width:0}
.cm-nm{font-weight:600;overflow-wrap:anywhere}
.cm-pc{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.cm-sub{grid-column:3 / 5;font-size:.82rem;color:var(--muted)}
.cm-msgs{height:min(55vh,420px);overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:6px 2px;margin-bottom:10px}
.cm-m{max-width:80%;align-self:flex-start;background:var(--accent-soft);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.cm-m.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.cm-who{font-size:.75rem;opacity:.75}
.cm-t{overflow-wrap:anywhere;white-space:pre-wrap}
@media (max-width:640px){.cm-two{grid-template-columns:minmax(0,1fr)}}
.brandbox{display:flex;flex-direction:column;line-height:1.3}
.byline{font-size:.8rem;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.85rem;padding-top:8px}
@media (prefers-reduced-motion:reduce){.bar i,.ring .arc{transition:none}}

/* ===== Redesign: sidebar layout, subject colours, phone tab bar ===== */
:root{--side:#ffffff;--c-phy:#2f6fd6;--c-math:#8a4fd6;--c-bio:#12805a;--c-chem:#b86a12;--c-ict:#d63a6f;--c-x0:#0e8f9a;--c-x1:#c2410c;--c-x2:#4d7c0f;--c-x3:#a21caf;--c-x4:#0369a1;--c-x5:#b45309}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--side:#12152b;--c-phy:#6aa8ff;--c-math:#c79bff;--c-bio:#4fd1a1;--c-chem:#ffb86b;--c-ict:#ff7fa8;--c-x0:#5fd6e0;--c-x1:#ff9a6b;--c-x2:#b4e35f;--c-x3:#f08be8;--c-x4:#7cc4ff;--c-x5:#ffd36b}}
:root[data-theme="dark"]{--side:#12152b;--c-phy:#6aa8ff;--c-math:#c79bff;--c-bio:#4fd1a1;--c-chem:#ffb86b;--c-ict:#ff7fa8;--c-x0:#5fd6e0;--c-x1:#ff9a6b;--c-x2:#b4e35f;--c-x3:#f08be8;--c-x4:#7cc4ff;--c-x5:#ffd36b}
.s-phy{--c:var(--c-phy)}.s-math{--c:var(--c-math)}.s-bio{--c:var(--c-bio)}.s-chem{--c:var(--c-chem)}.s-ict{--c:var(--c-ict)}
body{padding:0;background:var(--bg)}
.app{display:flex;min-height:100vh;max-width:1480px;margin:0 auto}
.side{flex:0 0 250px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;padding:26px 16px 20px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:22px}
.mainwrap{flex:1 1 0;min-width:0;padding:30px 40px 48px;display:flex;flex-direction:column;gap:16px}
.mtop{display:none}
.brandbox{flex-direction:row;align-items:center;gap:10px}
.brandbox .bt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* ===== Motion ===== */
:root{--ease:cubic-bezier(.22,1,.36,1);--bad:#ff5a6a}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes cellin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.08)}100%{transform:none}}
@keyframes tick{0%{transform:rotate(45deg) scale(0)}60%{transform:rotate(45deg) scale(1.15)}100%{transform:rotate(45deg) scale(1)}}
@keyframes livepulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
@keyframes sweep{from{background-position:-100% 0}to{background-position:200% 0}}
@keyframes bodyin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes shine{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,40px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,-30px)}}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;border-radius:50%;filter:blur(80px)}
body::before{width:420px;height:420px;left:20%;top:-130px;background:color-mix(in srgb,var(--p1) 30%,transparent);animation:drift1 18s ease-in-out infinite}
body::after{width:380px;height:380px;right:-90px;bottom:-110px;background:color-mix(in srgb,var(--p3) 22%,transparent);animation:drift2 21s ease-in-out infinite}
.app{position:relative;z-index:1}
.enter .rise{animation:rise .55s var(--ease) both;animation-delay:var(--d,0ms)}
.enter .bar i{transition-duration:1.2s}
.enter .ring .arc{transition-duration:1.5s}
.enter .wk .c i{transform-origin:bottom;animation:grow .7s var(--ease) both;animation-delay:calc(250ms + var(--i,0) * 55ms)}
.enter .hgrid .hc:not(.blank){animation:cellin .4s var(--ease) both;animation-delay:calc(300ms + var(--i,0) * 14ms)}
.enter .bdg{animation:fadein .4s var(--ease) both;animation-delay:calc(350ms + var(--i,0) * 40ms)}
.enter .bdg:not(.lock) .bi{animation:pop .55s var(--ease) both;animation-delay:calc(350ms + var(--i,0) * 40ms)}
.card,.stat,.scard,.btn,.nav a,.ch{transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease),filter .2s var(--ease)}
.stat:hover,.card:hover{box-shadow:0 12px 32px -14px color-mix(in srgb,var(--accent) 60%,transparent)}
.scard:hover{transform:translateY(-3px);box-shadow:0 14px 34px -14px color-mix(in srgb,var(--c) 65%,transparent)}
.scard:active{transform:translateY(0) scale(.99)}
.scard:hover .bar i{filter:brightness(1.15)}
.btn:hover{transform:translateY(-1px)}
.btn.pri:hover{filter:brightness(1.1);box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn:active,.rb:active,.tabs button:active,.wkb:active{transform:scale(.96)}
.nav a:hover{transform:translateX(3px)}
.nav a .dot{transition:transform .2s var(--ease)}
.nav a:hover .dot,.nav a.on .dot{transform:scale(1.35)}
.wk .c i{transition:opacity .15s var(--ease),filter .15s var(--ease)}
.wk .c:hover i{opacity:.75}
.hc{transition:transform .15s var(--ease)}
.hgrid .hc:not(.blank):hover{transform:scale(1.1);z-index:1}
.hc.today{animation:none}
.overall .bar i,.scard .bar i,.cont .bar i{position:relative;overflow:hidden}
.overall .bar i::after,.scard .bar i::after,.cont .bar i::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shine 2.6s ease-in-out infinite}
.pix{display:block;width:100%;max-width:520px;height:40px;margin-top:14px;--px-off:var(--fg)}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:8px;vertical-align:middle;animation:livepulse 1.6s ease-out infinite}
/* checkbox: fills, tick snaps in, strike draws */
.tl input[type=checkbox],.tl2 input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--muted);background:var(--bg);position:relative;cursor:pointer;display:grid;place-content:center;transition:background-color .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease)}
.tl input[type=checkbox]:hover,.tl2 input[type=checkbox]:hover{border-color:var(--accent)}
.tl input[type=checkbox]:active,.tl2 input[type=checkbox]:active{transform:scale(.88)}
.tl input[type=checkbox]::after,.tl2 input[type=checkbox]::after{content:"";width:5px;height:10px;margin-top:-2px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0)}
.tl input[type=checkbox]:checked,.tl2 input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.tl input[type=checkbox]:checked::after,.tl2 input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1);animation:tick .3s var(--ease)}
.tl label span,.tl2 label span{background:linear-gradient(currentColor,currentColor) no-repeat 0 55%/0 1px;transition:background-size .35s var(--ease),color .25s var(--ease);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tl input:checked + span,.tl2 input:checked + span{text-decoration:none;background-size:100% 1px;color:var(--muted)}
.ch[open] .body{animation:bodyin .28s var(--ease)}
.ch.full .no{background:var(--c);color:var(--bg)}
.ch.flash summary{background-image:linear-gradient(100deg,transparent 0%,color-mix(in srgb,var(--c) 28%,transparent) 45%,transparent 70%);background-size:50% 100%;background-repeat:no-repeat;animation:sweep .9s var(--ease) 1}
.ch.flash .no{animation:pop .5s var(--ease)}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ===== Exam syllabus picker ===== */
.advw{margin-top:14px}
.advr{display:grid;grid-template-columns:minmax(7rem,12rem) 1fr 3.5rem;gap:10px;align-items:center;padding:5px 0;font-size:.85rem}
.advr .bar{height:6px}.advr b{text-align:right;font-variant-numeric:tabular-nums}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:auto;background:var(--bg);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gt-c{width:100%;max-width:380px;margin:auto;text-align:center}
.gt-c.card{text-align:left;padding:26px 22px}
.gt-ld{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:60vh;justify-content:center;position:relative}
.gt-bars{display:flex;gap:6px;align-items:flex-end;height:44px}
.gt-bars b{width:10px;border-radius:3px;background:var(--accent);height:12px;opacity:.45;animation:gtb 1.1s ease-in-out infinite}
.gt-bars b:nth-child(2){animation-delay:.12s}.gt-bars b:nth-child(3){animation-delay:.24s}.gt-bars b:nth-child(4){animation-delay:.36s}.gt-bars b:nth-child(5){animation-delay:.48s}
@keyframes gtb{0%,100%{height:12px;opacity:.45}50%{height:44px;opacity:1}}
.gt-wm{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;color:var(--fg)}
.gt-tip{min-height:2.6em;max-width:300px;font-size:.82rem;color:var(--muted);line-height:1.45;animation:gtt .5s ease}
@keyframes gtt{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.gt-ldf{position:absolute;bottom:0;left:0;right:0;font-size:.72rem;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.gt-bars b,.gt-tip{animation:none}.gt-bars b{height:28px;opacity:.8}}
.gt-logo{width:64px;height:64px;border-radius:18px;background:#e8b24a;color:#141415;display:grid;place-items:center;margin:0 auto 12px}
.gt-logo svg{width:34px;height:34px}
.gt-t{font-size:1.3rem;text-align:center;margin:0}
.gt-s{text-align:center;margin:4px 0 16px}
.gt-go{width:100%;margin-top:14px}
.gt-n,.gt-f{text-align:center;margin-top:12px;font-size:.78rem}
html.gated body{overflow:hidden}
.exitem{padding:10px 0;border-top:1px solid var(--line)}
.exitem:first-of-type{border-top:0}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center}
.ex .nm{font-weight:700;display:flex;align-items:center;gap:8px;min-width:0}
.ex .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl{justify-self:end;text-align:right;line-height:1.1}
.dl b{font-size:1.25rem;color:var(--accent);font-variant-numeric:tabular-nums}
.dl small{display:block;color:var(--muted,var(--fg));opacity:.7;font-size:.72rem}
.dl.warm b{color:#ffb454}.dl.hot b{color:#ff6b8a}
.meta{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:.8rem;min-width:0;flex-wrap:wrap}
.meta .grow{flex:1}.meta .empty{opacity:.7}
.meta .dots{display:flex;gap:4px;flex:none}
.meta .dots i{width:9px;height:9px;border-radius:50%;background:var(--c);display:block}
.meta .bar{flex:1 1 60px;height:5px;min-width:40px}
.meta .pc{font-weight:700;font-variant-numeric:tabular-nums}
.meta .date{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 8px;font-size:.8rem;min-width:0}
.meta .lk{font:inherit;font-size:.8rem;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
.meta .lk:hover{text-decoration:underline}
.addb{font:inherit;font-size:.8rem;font-weight:700;color:var(--accent);background:none;border:1px solid var(--line);border-radius:99px;padding:4px 12px;cursor:pointer}
.exnew{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.exadd{margin-top:0}
.exinfo{display:flex;flex-direction:column;gap:10px;padding:2px 0 14px}
.exinfo.ed{padding:14px;border-radius:16px;background:var(--accent-soft);margin-bottom:12px}
.exinfo .exh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exchips{display:flex;flex-wrap:wrap;gap:6px}
.exchip{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:99px;font-size:.76rem;font-weight:600;background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--fg)}
.exchip .dot,.exp .dot{width:8px;height:8px;border-radius:50%;background:var(--c);display:block;flex:0 0 auto}
.exmeta{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.exmeta .bar{flex:1 1 120px;height:6px}
.exmeta .lnk{margin:0}
.exnew{display:flex;flex-direction:column;gap:10px}
.exsel{border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.exsel>summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:44px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-weight:600;font-size:.92rem}
.exsel>summary::-webkit-details-marker{display:none}
.exsel>summary span{color:var(--accent);font-size:.82rem}
.exsel[open]>summary{border-bottom:1px solid var(--line)}
.expk{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.expk>.sub{margin:0 0 4px;font-size:.82rem}
.exp{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.exp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:44px}
.exp>summary::-webkit-details-marker{display:none}
.exp .exn{flex:1;min-width:0;font-weight:600;font-size:.9rem}
.exp .exc{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.exp[open]{border-color:var(--c)}
.exl{list-style:none;margin:0;padding:4px 12px 10px 40px;display:flex;flex-direction:column}
.exl label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer;font-size:.9rem}
.exp input[type=checkbox],.exl input[type=checkbox]{width:20px;height:20px;flex:0 0 auto;accent-color:var(--c,var(--accent));margin:0}
.exl input[type=checkbox]{margin-top:.15rem}

/* ===== Mark whole chapter + exam percent ===== */
.fullbtn{flex:0 0 auto;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.76rem;font-weight:700;transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease)}
.fullbtn:hover{border-color:var(--c,var(--accent));color:var(--fg)}
.fullbtn.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--bg)}
.fullbtn:active{transform:scale(.95)}
.upc{display:block;margin-top:6px}
.upc b{color:var(--accent);font-size:1rem}
.stat .bar{margin-top:6px;height:6px}
.stat .bar i{background:linear-gradient(90deg,var(--p3),var(--p2))}
.cont .lnk{display:block}

/* ===== Studying-now status ===== */
@keyframes nowpulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--accent)) 60%,transparent)}100%{box-shadow:0 0 0 7px transparent}}
.nowbtn{flex:0 0 auto;display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.76rem;font-weight:700;transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease)}
.nowbtn:hover{border-color:var(--c,var(--accent));color:var(--fg)}
.nowbtn.on{background:color-mix(in srgb,var(--c,var(--accent)) 20%,transparent);border-color:var(--c,var(--accent));color:var(--c,var(--accent))}
.nowbtn:active{transform:scale(.95)}
.nowbtn .live,.nowc .live{background:var(--c,var(--accent));animation:nowpulse 1.6s ease-out infinite}
.nowbtn .live{margin-right:7px}
.ch.now{box-shadow:inset 3px 0 0 var(--c,var(--accent))}
.ch.full .nowbtn{display:none}
.nowc .chead h2{display:flex;align-items:center}
.nowc .rq em{font-style:normal;font-weight:800;color:var(--c);font-variant-numeric:tabular-nums}
.nowc .rq button{justify-content:flex-start}
.nowc .rq span{flex:1}

.wcbtn{flex:0 0 auto;min-height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:.76rem;font-weight:700;transition:background-color .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease),transform .12s var(--ease)}
.wcbtn:hover{border-color:#ff6b6b;color:var(--fg)}
.wcbtn.on{background:color-mix(in srgb,#ff6b6b 20%,transparent);border-color:#ff6b6b;color:#ff6b6b}
.wcbtn:active{transform:scale(.95)}

/* ===== Manage subjects ===== */
.mlist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
.mlist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);flex-wrap:wrap}
.mlist li.off{opacity:.55}
.mlist .dot{width:12px;height:12px;border-radius:50%;background:var(--c);flex:0 0 auto}
.mlist .mn{flex:1 1 9rem;min-width:0;display:flex;flex-direction:column}
.mlist .mn small{color:var(--muted);font-size:.78rem}
.mlist .btn{min-height:34px;padding:0 12px}
.mlist .btn:disabled{opacity:.4}
.ed .in{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
.ed textarea.in{resize:vertical;line-height:1.6;margin-bottom:0}
.edp{margin:14px 0;padding:14px;border-radius:16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:10px}

.edph .btn{flex:0 0 auto;min-height:40px}
.edc{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}

.edch .n{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center}

.inst .acts{margin:10px 0}
.inst-h{line-height:1.7;margin-top:6px}

.logo.lg{background:#e8b24a;overflow:hidden;width:38px;height:38px;border-radius:11px;color:#141415}

.cm-bm{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}

.remb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;background:linear-gradient(120deg,color-mix(in srgb,#ffb86b 22%,var(--surface)),var(--surface));border-color:color-mix(in srgb,#ffb86b 55%,var(--line))}

.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:stretch}

.fxc{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:9999}

}

function byId(a,id){for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i]}

function topics(p,ci){
  var base=p.ch[ci][1].split('|').map(function(t,i){return {id:p.id+'.'+ci+'.'+i,t:t}});
  var cu=(S.custom[p.id+'.'+ci]||[]).map(function(x){return {id:x.id,t:x.t,custom:true}});

}

function sStat(s){var r={d:0,t:0};s.papers.forEach(function(p){r=add(r,pStat(p))});return r}
function allStat(){var r={d:0,t:0};DATA.forEach(function(s){r=add(r,sStat(s))});return r}
function pct(st){return st.t?Math.floor(st.d*100/st.t):0}

function statFor(k){
  var a=k.split(':');
  if(a[0]==='all')return allStat();
  if(a[0]==='s')return sStat(byId(DATA,a[1]));
  var p=byId(PAPERS,a[1]);
  if(a[0]==='p')return pStat(p);
  return chStat(p,+a[2]);
}
function chapStat(k){
  var a=k.split(':'),ps;
  if(a[0]==='all')ps=PAPERS;
  else if(a[0]==='s')ps=byId(DATA,a[1]).papers;
  else ps=[byId(PAPERS,a[1])];
  var d=0,t=0;
  ps.forEach(function(p){p.ch.forEach(function(_,ci){var s=chStat(p,ci);t++;if(s.t>0&&s.d===s.t)d++})});
  return {d:d,t:t};
}

/* ===== Motion helpers ===== */
var ENTER=false,RM=false;
try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function easeOut(p){return 1-Math.pow(1-p,4)}
function tw(el,to,f,dur){
  var from=el._n;el._n=to;
  if(from==null&&ENTER)from=0;
  if(RM||from==null||from===to){el.textContent=f(to);return}
  cancelAnimationFrame(el._raf);
  var t0=performance.now();dur=dur||(ENTER?900:500);
  (function step(now){
    var p=Math.min(1,(now-t0)/dur);
    el.textContent=f(from+(to-from)*easeOut(p));
    if(p<1)el._raf=requestAnimationFrame(step);
  })(t0);
}
function later(fn){if(ENTER&&!RM)requestAnimationFrame(function(){requestAnimationFrame(fn)});else fn()}
function updateStats(){
  document.querySelectorAll('[data-k]').forEach(function(el){
    var st=statFor(el.dataset.k),pc=pct(st),v=el.dataset.v,f=String;
    if(v==='pct')tw(el,pc,function(x){return f(Math.round(x))+'%'});
    else if(v==='pct1')tw(el,ratio(st),function(x){return x.toFixed(1)+'%'});
    else if(v==='cnt')el.textContent=f(st.d)+'/'+f(st.t);
    else if(v==='bar'){var w=ratio(st)+'%';later(function(){el.style.width=w})}
    else if(v==='ring'){var o=String((1-ratio(st)/100)*C);if(el.dataset.k==='all')pixSet(ratio(st)/100);later(function(){el.style.strokeDashoffset=o})}
    else if(v==='chcnt'){var c=chapStat(el.dataset.k);el.textContent=c.d+'/'+c.t+' chapters'}
    else if(v==='chof'){var c2=chapStat(el.dataset.k);el.textContent=c2.d+' of '+c2.t+' chapters completed'}
  });
}

function achievement(){
  var st=allStat(),cs=chapStat('all'),pc=ratio(st);
  if(st.d===0)return ["Let's begin","Tick your first topic and your journey starts."];
  if(pc>=100)return ['Syllabus complete','You finished every topic. Time to revise.'];
  if(pc>=75)return ['Almost there','Less than a quarter of the syllabus is left.'];
  if(pc>=50)return ['Halfway there','Half the syllabus is done. Keep the pace.'];
  if(pc>=25)return ['Quarter done','A quarter of the syllabus is behind you.'];
  if(cs.d>=1)return ['Great start!','Every chapter counts. Stay consistent.'];
  return ['Good start','Topics are adding up. Finish a chapter next.'];
}
function week(){
  var out=[],d=new Date(),tk=dkey(new Date());
  d.setDate(d.getDate()-6);
  for(var i=0;i<7;i++){
    var k=dkey(d),s=S.log[k]||0;
    if(k===tk)s+=elapsed();
    out.push({l:d.toLocaleDateString('en-US',{weekday:'short'}),s:s});
    d.setDate(d.getDate()+1);
  }
  return out;
}
function tasksToShow(){
  var t=dkey(new Date());
  return S.tasks.filter(function(x){return x.date===t||(!x.done&&x.date<t)}).sort(function(a,b){return (a.done?1:0)-(b.done?1:0)});
}
function greeting(){var h=new Date().getHours();return h<5?'Good night':h<12?'Good morning':h<17?'Good afternoon':h<21?'Good evening':'Good night'}

function addLog(sec,ck){
  var k=dkey(new Date());S.log[k]=(S.log[k]||0)+sec;
  if(ck){var d=S.sess[k]=S.sess[k]||{};d[ck]=(d[ck]||0)+sec}
}
function validCk(ck){
  if(typeof ck!=='string')return false;
  var a=ck.split('.'),p=byId(PAPERS,a[0]);
  return !!(p&&a.length===2&&+a[1]>=0&&+a[1]<p.ch.length);
}
function curCk(){
  if(validCk(S.pick))return S.pick;
  var nx=nextChapter();
  return nx?nx.ck:(PAPERS[0].id+'.0');
}
function bumpDay(n){var k=dkey(new Date());S.dd[k]=Math.max(0,(S.dd[k]||0)+n)}
function pomoRem(){var p=S.pomo;return p.end>0?Math.max(0,Math.round((p.end-Date.now())/1000)):p.rem}
function pomoTotal(){var p=S.pomo,c=S.pset;return p.m==='f'?c.f*60:(p.round%4===0?c.l*60:c.b*60)}
function pomoNext(){
  var p=S.pomo,done=pomoTotal()-pomoRem();
  if(p.m==='f'){if(done>=60)addLog(done,curCk());p.m='b'}else{p.m='f';p.round++}
  p.end=0;p.rem=pomoTotal();
}
function pomoTick(){
  var p=S.pomo;
  if(p.end>0&&pomoRem()<=0){
    pomoNext();save();
    try{document.title='Time is up - StudyMate'}catch(e){}
    if(cur==='dash')render();
    return;
  }
  var t=document.getElementById('pm-t');
  if(t){
    var r=pomoRem();
    t.textContent=pad(Math.floor(r/60))+':'+pad(r%60);
    var a=document.getElementById('pm-a');
    if(a)a.style.strokeDashoffset=String(PC*(1-r/pomoTotal()));
  }
}

var heatDay='',heatOff=0;
function dayLabel(k){return new Date(k+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}
function heatDetail(key){
  var tk=dkey(new Date()),tot=(S.log[key]||0)+(key===tk?elapsed():0),sess=S.sess[key]||{};
  var ks=Object.keys(sess).filter(function(k){return validCk(k)&&sess[k]>0}).sort(function(a,b){return sess[b]-sess[a]});
  var h='<div class="hday"><div class="hd-t"><b>'+dayLabel(key)+'</b><span>'+(tot>0?fmt(tot)+' studied':'No study time')+'</span></div>';
  var sum=0;
  if(ks.length){
    h+='<ul class="hd-l">';
    ks.forEach(function(k){
      var c=chapterOf(k);sum+=sess[k];
      h+='<li class="s-'+c.p.sid+'"><i class="dot"></i><span><b>'+esc(c.p.ch[c.ci][0])+'</b><small>'+c.p.en+' · Chapter '+(c.ci+1)+'</small></span><em>'+fmt(sess[k])+'</em></li>';
    });
    h+='</ul>';
  }
  if(tot-sum>=60)h+='<p class="sub hd-o">'+(ks.length?'Other study time: ':'No chapter was saved for this time: ')+fmt(tot-sum)+'</p>';
  else if(!ks.length&&tot<=0)h+='<p class="sub hd-o">Nothing saved for this day. Pick a chapter above and press Start studying.</p>';
  return h+'</div>';
}
function heatHtml(){

var exSel=[],exOpen={},exEditId='',exAdd=false;
function exSet(key){
  if(key==='new')return exSel;

  if(!ex)return [];
  return ex.cks=ex.cks||[];
}
function exToggle(key,ck,on){
  var a=exSet(key),i=a.indexOf(ck);
  if(on&&i<0)a.push(ck);
  if(!on&&i>=0)a.splice(i,1);
  if(key!=='new')save();
}
function exStat(cks){
  var r={d:0,t:0};
  cks.forEach(function(ck){if(validCk(ck)){var c=chapterOf(ck);r=add(r,chStat(c.p,c.ci))}});
  return r;
}
function exSync(){
  app.querySelectorAll('input[data-act=expaper]').forEach(function(pc){
    var key=pc.dataset.xk,sel=exSet(key),p=byId(PAPERS,pc.dataset.p),n=0;
    p.ch.forEach(function(_,ci){
      var ck=p.id+'.'+ci,on=sel.indexOf(ck)>=0;
      if(on)n++;
      var i=app.querySelector('input[data-act=exck][data-xk="'+key+'"][data-ck="'+ck+'"]');
      if(i)i.checked=on;
    });
    pc.checked=n===p.ch.length;pc.indeterminate=n>0&&n<p.ch.length;

function bestStreak(){
  var ks=Object.keys(S.log).filter(function(k){return S.log[k]>0}).sort(),best=0,run=0,prev=null;
  ks.forEach(function(k){
    var d=new Date(k+'T00:00:00');
    if(prev&&Math.round((d-prev)/864e5)===1)run++;else run=1;
    if(run>best)best=run;prev=d;
  });
  return Math.max(best,streak());
}

/* ===== Revision reminder (1, 3, 7, 14 days after finishing a chapter) ===== */
var REVIV=[1,3,7,14];
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function reviseHtml(){
  var td=dkey(new Date()),due=[],soon=[];
  Object.keys(S.fin).forEach(function(ck){
    var a=ck.split('.'),p=byId(PAPERS,a[0]);if(!p)return;
    var ci=+a[1],c=p.ch[ci];if(!c)return;
    var st=chStat(p,ci);if(!(st.t>0&&st.d===st.t))return;
    var k=+S.rev[ck]||0;if(k>=REVIV.length)return;
    var wait=dayDiff(S.fin[ck],td)-REVIV[k];
    var x={ck:ck,p:p,ci:ci,t:c[0],k:k,ago:dayDiff(S.fin[ck],td),wait:wait};
    if(wait>=0)due.push(x);else soon.push(x);
  });
  due.sort(function(a,b){return b.wait-a.wait});soon.sort(function(a,b){return b.wait-a.wait});
  var h='<section class="card rvc"><div class="chead"><h2>Revise today</h2><span class="sub">'+(due.length?due.length+(due.length===1?' chapter':' chapters'):'All clear')+'</span></div>';
  if(!Object.keys(S.fin).length)return h+'<p class="sub">Finish a chapter and it will show up here to revise after 1, 3, 7 and 14 days.</p></section>';
  if(!due.length)h+='<p class="sub rvok">Nothing to revise today. Nice work!</p>';
  else{
    h+='<ul class="rq rvl">';
    due.slice(0,6).forEach(function(x){
      h+='<li class="s-'+x.p.sid+'"><button type="button" data-act="goto" data-ck="'+x.ck+'"><i class="dot"></i><span>'+esc(x.t)+'<small>'+x.p.en+' · finished '+(x.ago<=0?'today':x.ago===1?'1 day ago':x.ago+' days ago')+'</small></span></button><em class="rvt">Revision '+(x.k+1)+' of 4</em><button type="button" class="rvb" data-act="revup" data-ck="'+x.ck+'">Revised</button></li>';
    });
    h+='</ul>';
    if(due.length>6)h+='<p class="sub">+ '+(due.length-6)+' more</p>';
  }
  if(soon.length){
    var nx=soon.slice(-3).reverse().map(function(x){var n=-x.wait;return '<b>'+(n===1?'Tomorrow':'In '+n+' days')+'</b> · '+esc(x.t)});
    h+='<p class="sub rvn">Coming up: '+nx.join(' &nbsp;·&nbsp; ')+'</p>';
  }
  return h+'</section>';
}

  var wk=week(),mx=Math.max.apply(null,wk.map(function(x){return x.s}).concat([1])),tot=0,days=0,bi=-1,bv=0,i;
  wk.forEach(function(x,j){tot+=x.s;if(x.s>0)days++;if(x.s>bv){bv=x.s;bi=j}});
  var prev=0,d=new Date();d.setDate(d.getDate()-7);
  for(i=0;i<7;i++){prev+=S.log[dkey(d)]||0;d.setDate(d.getDate()-1)}
  var tp=0,chs=0,by={},keys={},d2=new Date();
  for(i=0;i<7;i++){
    var k=dkey(d2);keys[k]=1;tp+=S.dd[k]||0;
    var ss=S.sess[k];
    if(ss)Object.keys(ss).forEach(function(ck){var p=byId(PAPERS,ck.split('.')[0]);if(p)by[p.sid]=(by[p.sid]||0)+ss[ck]});

function routineHtml(cks,days){
  var scope=cks.length?cks:[];
  if(!scope.length)PAPERS.forEach(function(p){p.ch.forEach(function(c,ci){scope.push(p.id+'.'+ci)})});
  var left=scope.filter(function(ck){var c=chapterOf(ck);if(!c.p)return false;var st=chStat(c.p,c.ci);return !(st.t>0&&st.d===st.t)});
  if(!left.length)return '';
  var dd=Math.max(days,1),per=left.length/dd,n=Math.min(left.length,Math.max(1,Math.ceil(per)));
  var tone=per<=1?['ok','On track']:per<=2?['tight','A little tight']:['late','Behind: start now'];
  var by={},order=[];
  left.forEach(function(ck){var p=chapterOf(ck).p;if(!by[p.sid]){by[p.sid]=[];order.push(p.sid)}by[p.sid].push(ck)});
  var pick=[];
  for(var i=0;i<n;i++){
    var best=null;order.forEach(function(sid){if(by[sid].length&&(best===null||by[sid].length>by[best].length))best=sid});
    if(best===null)break;pick.push(by[best].shift());
  }
  var h='<div class="rt"><div class="rt-h"><div><b>'+per.toFixed(1)+'</b><span>chapters per day</span></div><div><b>'+left.length+'</b><span>chapters left</span></div><span class="rt-p '+tone[0]+'">'+tone[1]+'</span></div>';
  h+='<div class="rq-h">Today\'s plan · about '+n+(n===1?' chapter':' chapters')+'</div><ul class="rq">';
  pick.forEach(function(ck){var c=chapterOf(ck);h+='<li class="s-'+c.p.sid+'"><button type="button" data-act="goto" data-ck="'+ck+'"><i class="dot"></i><span>'+esc(c.p.ch[c.ci][0])+'<small>'+c.p.en+' · Chapter '+(c.ci+1)+'</small></span></button></li>'});
  return h+'</ul></div>';
}

var FXS=(function(){

  function ensure(){

    document.body.appendChild(cv);c=cv.getContext('2d');
  }
  function size(){var d=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;c.setTransform(d,0,0,d,0,0)}
  function loop(now){
    var dt=Math.min(.04,(now-last)/1000);last=now;size();
    ps=ps.filter(function(p){return p.l>0});

      p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.995;p.l-=dt*p.dec;p.r+=p.spin*dt;

  }
  function go(){if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}}
  return {
    confetti:function(x,y,n){
      if(RM)return;ensure();var C=cols();
      for(var i=0;i<n;i++){var a=-Math.PI/2+(Math.random()-.5)*2.4,v=160+Math.random()*260;

function mngClick(el,act){
  var p=+el.dataset.p,c=+el.dataset.c;
  function msg(t){var m=document.getElementById('edmsg');if(m)m.textContent=t}
  if(act==='subnew'){ED=newDraft();render();return true}
  if(act==='subedit'){var cs=csById(el.dataset.id);if(cs){ED=draftOf(cs);render()}return true}
  if(act==='subdel'){
    var id=el.dataset.id;
    if(!confirm('Delete this subject and all of its progress?'))return true;
    S.cs=S.cs.filter(function(x){return x.id!==id});
    [S.done,S.custom,S.weak,S.rev,S.now,S.wch].forEach(function(o){Object.keys(o).forEach(function(k){if(k.indexOf(id+'_')===0)delete o[k]})});
    rebuild();save();ED=null;render();return true;
  }
  if(act==='subhide'){
    var hid=el.dataset.id;
    if(S.hide[hid])delete S.hide[hid];else if(DATA.length>1)S.hide[hid]=1;
    rebuild();save();render();return true;
  }
  if(act.indexOf('ed')!==0||!ED)return false;
  if(act==='edaddp'){ED.papers.push({pid:null,n:'Paper '+(ED.papers.length+1),ch:[{t:'',tp:''}]});render();return true}
  if(act==='edaddc'){ED.papers[p].ch.push({t:'',tp:''});render();return true}
  if(act==='edrmp'){ED.papers.splice(p,1);render();return true}
  if(act==='edrmc'){ED.papers[p].ch.splice(c,1);render();return true}
  if(act==='edcancel'){ED=null;render();return true}
  if(act==='edsave'){
    var name=ED.name.trim();
    if(!name){msg('Please write the subject name.');return true}
    var ps=[];
    ED.papers.forEach(function(q){
      var ch=[];
      q.ch.forEach(function(x){
        var t=x.t.trim().replace(/\|/g,'/');if(!t)return;
        var tp=x.tp.split('\n').map(function(l){return l.trim().replace(/\|/g,'/')}).filter(Boolean);
        if(!tp.length)tp=[t];
        ch.push({t:t,tp:tp});
      });
      if(ch.length)ps.push({pid:q.pid,n:q.n.trim().replace(/\|/g,'/')||'Paper',ch:ch});
    });
    if(!ps.length){msg('Add at least one chapter with a name.');return true}
    var mx=0;ps.forEach(function(q){if(q.pid)mx=Math.max(mx,+q.pid.slice(1))});
    ps.forEach(function(q){if(!q.pid)q.pid='p'+(++mx)});
    var rec;
    if(ED.id){rec=csById(ED.id);rec.name=name;rec.cls=ED.cls.trim();rec.papers=ps}
    else{rec={id:'c'+Date.now().toString(36),name:name,cls:ED.cls.trim(),cc:S.cs.length%6,papers:ps};S.cs.push(rec)}
    rebuild();save();ED=null;location.hash='#'+rec.id;
    return true;
  }
  return false;
}

/* ===== Daily reminder ===== */
function remDue(){
  if(!S.rem.on)return false;
  var n=new Date(),p=S.rem.t.split(':');
  return n.getHours()*60+n.getMinutes()>=(+p[0])*60+(+p[1])&&todaySec()<=0;
}
function remText(){
  var st=0,d=new Date();d.setDate(d.getDate()-1);
  while((S.log[dkey(d)]||0)>0){st++;d.setDate(d.getDate()-1)}
  return st>0?{t:'Keep your '+st+'-day streak alive',b:'You have not studied today. Even 20 minutes counts!'}:{t:'Time to study',b:'You have not studied today yet. Start a short session now.'};
}
function remNotify(title,body){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return false;
    var opt={body:body,icon:'icon-192.png',badge:'icon-192.png',tag:'daily-reminder'};
    if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(r){if(r)r.showNotification(title,opt);else new Notification(title,opt)}).catch(function(){try{new Notification(title,opt)}catch(e){}});
    }else new Notification(title,opt);
    return true;
  }catch(e){return false}
}
function remCheck(){
  var today=dkey(new Date());
  if(!remDue()||S.remLast===today)return;
  if(document.visibilityState==='visible')return;
  var m=remText();
  if(remNotify(m.t,m.b)){S.remLast=today;save()}
}
setInterval(remCheck,30000);
document.addEventListener('visibilitychange',remCheck);
function remBanner(){
  if(!remDue())return '';
  var m=remText();
  return '<section class="card remb"><div><b>'+m.t+'</b><p class="sub">'+m.b+'</p></div><button class="btn pri" type="button" data-act="start" data-ck="'+curCk()+'">Start studying</button></section>';
}
function remCard(){
  var on=!!S.rem.on;
  var h='<section class="card remc"><div class="chead"><h2>Daily reminder</h2><button type="button" class="swt'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="Daily reminder" data-act="remtoggle"><i></i></button></div>';
  h+='<div class="remrow"><label class="nl" for="remt">Remind me at</label><input type="time" id="remt" class="remt" data-act="remtime" value="'+S.rem.t+'"></div>';
  h+='<div class="acts"><button class="btn" type="button" data-act="remtest">Send test</button></div>';
  h+='<div class="msg" id="remmsg" role="status"></div>';
  h+='<p class="sub inst-h">A nudge if you have not studied by this time. It works while the app is open or in the background; if it is closed you will see a banner on opening.</p></section>';
  return h;
}
function remMsg(t){var m=document.getElementById('remmsg');if(m)m.textContent=t}
function remClick(act){
  var supported='Notification' in window;
  if(act==='remtoggle'){
    if(S.rem.on){S.rem.on=false;save();render();return}
    S.rem.on=true;save();
    if(supported&&Notification.permission==='default'){
      try{var pr=Notification.requestPermission();if(pr&&pr.then)pr.then(function(){render();remMsg(Notification.permission==='granted'?'Reminder is on.':'Notifications are blocked, so you will see the reminder as a banner here.')});else render()}catch(e){render()}
    }else{
      render();
      remMsg(!supported?'This browser has no notifications. You will see a banner here instead.':(Notification.permission==='granted'?'Reminder is on.':'Notifications are blocked in your browser settings. You will see a banner here instead.'));
    }
  }else if(act==='remtest'){
    if(!supported){remMsg('This browser does not support notifications.');return}
    if(Notification.permission==='default'){try{Notification.requestPermission().then(function(){remClick('remtest')})}catch(e){}return}
    if(Notification.permission!=='granted'){remMsg('Notifications are blocked. Allow them in your browser or phone settings for this site.');return}
    var m=remText();remNotify(m.t,m.b);remMsg('Test sent. Check your notifications.');
  }
}

function cmBoardHtml(){

  var lim=new Date();lim.setDate(lim.getDate()-6);lim.setHours(0,0,0,0);
  var wkMode=CM.bm!=='all';
  var rows=CM.rows.map(function(r){
    var s=r.s||{},me=CM.user&&r.id===CM.user.id;
    var hid=!r.s||(+s.topics_total===0);
    if(me&&!S.share){
      var t0=0,d0=new Date();for(var k0=0;k0<7;k0++){t0+=S.log[dkey(d0)]||0;d0.setDate(d0.getDate()-1)}
      return {id:r.id,name:r.name||'Student',pct:ratio(allStat()),sec:todaySec(),wk:Math.floor(t0+elapsed()),st:streak(),hid:false,mehid:true};
    }

    return {id:r.id,name:r.name||'Student',pct:+s.overall_pct||0,sec:(s.today_date===today)?(+s.today_sec||0):0,wk:wk,st:(s.today_date&&s.today_date>=y)?(+s.streak||0):0,hid:false};
  });
  if(wkMode)rows.sort(function(a,b){return (a.hid-b.hid)||b.wk-a.wk||b.pct-a.pct});

  var h='<div class="cm-bm"><button type="button" class="'+(wkMode?'on':'')+'" data-act="cmbm" data-bm="wk">This week</button><button type="button" class="'+(wkMode?'':'on')+'" data-act="cmbm" data-bm="all">Overall progress</button></div>';

    var bar=wkMode?(mx?Math.max(r.wk>0?3:0,r.wk*100/mx):0):Math.min(100,r.pct);
    var big=wkMode?fmt(r.wk):r.pct.toFixed(1)+'%';
    var sub=wkMode?(r.pct.toFixed(1)+'% of syllabus done · '+r.st+(r.st===1?' day':' days')+' streak'):(fmt(r.sec)+' today · '+r.st+(r.st===1?' day':' days')+' streak');

function cmAuth(){
  var email=cmVal('cm-email').trim(),pass=cmVal('cm-pass'),up=CM.mode==='up',name='';
  if(up){name=cmVal('cm-name').trim().slice(0,30);if(!name)return cmMsg('Enter your name.',true)}

function cmSend(){

  i.value='';
  cmRun(cmSb.from('messages').insert({group_id:CM.gid,user_id:CM.user.id,body:v}).select().single()).then(function(m){
    if(m&&!CM.msgs.some(function(x){return x.id===m.id})){CM.msgs.push(m);cmPaintMsgs(true)}
  }).catch(function(e){var j=cmEl('cm-msg');if(j)j.value=v;cmFail(e)});
}
function cmClick(el,act){
  if(act==='cmmode'){CM.mode=el.dataset.mode;CM.msg='';cmPaint()}
  else if(act==='cmshare'){S.share=!S.share;save();cmPaint();cmPushStats();cmBeat(true)}
  else if(act==='cmbm'){CM.bm=el.dataset.bm;cmPaint()}
  else if(act==='cmauth'){cmAuth()}
  else if(act==='cmout'){soAsk()}
  else if(act==='cmsel'){CM.gid=el.dataset.id;CM.tab='board';CM.msg='';cmPaint();cmOpenGroup()}
  else if(act==='cmtab'){CM.tab=el.dataset.tab;CM.msg='';cmPaint();if(CM.tab==='board'||CM.tab==='room')cmLoadBoard()}
  else if(act==='cmcreate'){cmCreate()}
  else if(act==='cmjoin'){cmJoin()}
  else if(act==='cmsend'){cmSend()}
  else if(act==='cmcopy'){
    var code=el.dataset.code;
    try{navigator.clipboard.writeText(code).then(function(){cmMsg('Invite code copied.')},function(){cmMsg('Could not copy. Select the code and copy it by hand.',true)})}
    catch(err){cmMsg('Could not copy. Select the code and copy it by hand.',true)}
  }else if(act==='cmsync'){syPull(true)
  }else if(act==='cmpw'){CM.pw=!CM.pw;CM.msg='';cmPaint()
  }else if(act==='cmpwsave'){cmPwSave()
  }else if(act==='cmleave'){
    if(!CM.arm){CM.arm=true;cmPaint();setTimeout(function(){CM.arm=false;cmPaint()},4000);return}
    CM.arm=false;
    cmRun(cmSb.from('members').delete().eq('group_id',CM.gid).eq('user_id',CM.user.id)).then(function(){CM.gid=null;return cmLoadGroups()}).catch(cmFail);
  }
}
function cmPwSave(){

  if(a!==b)return cmMsg('The two passwords do not match.',true);
  CM.busy=true;cmMsg('');
  cmRun(cmSb.auth.updateUser({password:a})).then(function(){CM.busy=false;CM.pw=false;cmMsg('Password changed.')}).catch(cmFail);
}
function cmKey(act){

/* ===== Pull down to refresh ===== */
(function(){
  var el=document.createElement('div');el.id='ptr';el.setAttribute('aria-live','polite');
  el.innerHTML='<div class="ptr-b" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></div><span id="ptr-t">Pull to refresh</span>';
  document.body.appendChild(el);
  var tx=el.querySelector('#ptr-t'),bars=el.querySelectorAll('.ptr-b b'),y0=null,dy=0,busy=false,T=70;
  function top(){return window.pageYOffset||document.documentElement.scrollTop||0}
  function ok(t){
    if(busy||document.documentElement.classList.contains('gated')||document.getElementById('so-ov'))return false;
    var ps=document.querySelector('.palsheet');if(ps&&getComputedStyle(ps).display!=='none')return false;
    if(t&&t.closest&&t.closest('input,textarea,select,[contenteditable]'))return false;
    return top()<=0;
  }
  function paint(d){
    var p=Math.min(1,d/T);
    el.style.opacity=String(Math.min(1,d/30));
    el.style.transform='translate(-50%,'+(Math.min(d,110)-60)+'px)';
    bars.forEach(function(b,i){b.style.height=(5+p*(4+(i%3)*5))+'px'});
    tx.textContent=d>=T?'Release to refresh':'Pull to refresh';
  }
  function hide(){el.classList.remove('drag');el.style.opacity='';el.style.transform='';bars.forEach(function(b){b.style.height=''})}
  document.addEventListener('touchstart',function(e){
    if(e.touches.length===1&&ok(e.target)){y0=e.touches[0].clientY;dy=0}else y0=null;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(y0===null)return;
    var d=(e.touches[0].clientY-y0)*.5;
    if(d<=0||top()>0){if(dy>0)hide();y0=null;dy=0;return}
    dy=d;el.classList.add('drag');paint(d);
  },{passive:true});
  function end(){
    if(y0===null)return;y0=null;
    if(dy>=T)go();else hide();
    dy=0;
  }
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',end,{passive:true});
  function go(){
    busy=true;el.classList.remove('drag');el.classList.add('spin');tx.textContent='Refreshing…';
    el.style.opacity='1';el.style.transform='translate(-50%,14px)';
    var done=false,fin=function(){if(done)return;done=true;try{location.reload()}catch(e){}};
    setTimeout(fin,8000);
    /* 1. save progress, 2. check for a new version, 3. reload */
    Promise.resolve().then(function(){return syFlush()}).then(function(){
      if(CM.user&&(syMeta().mt||0)<(S.mt||0))return syPush();
    }).catch(function(){}).then(function(){
      var jobs=[];
      try{if(navigator.serviceWorker&&navigator.serviceWorker.getRegistration)jobs.push(navigator.serviceWorker.getRegistration().then(function(r){return r&&r.update()}).catch(function(){}))}catch(e){}
      try{jobs.push(fetch(location.pathname,{cache:'reload'}).catch(function(){}))}catch(e){}
      return Promise.all(jobs);
    }).catch(function(){}).then(function(){setTimeout(fin,500)});
  }
  /* laptop: two-finger swipe down on the trackpad while already at the top */
  var wa=0,wt=null,wlast=0,wok=false;
  document.addEventListener('wheel',function(e){
    if(busy)return;
    var now=Date.now(),fresh=now-wlast>350;wlast=now;
    if(fresh){wa=0;wok=ok(e.target)&&e.deltaY<0}
    if(!wok)return;
    if(e.deltaY>0||top()>0){wok=false;wa=0;hide();return}
    wa+=-e.deltaY;var d=wa*.3;
    el.classList.add('drag');paint(d);
    clearTimeout(wt);
    if(d>=T){wok=false;wa=0;go();return}
    wt=setTimeout(function(){wa=0;hide()},260);
  },{passive:true});
  window.appRefresh=go;
})();
cmInit();document.documentElement.classList.remove('pre');
setInterval(cmPushStats,60000);
route();
})();
</script>
